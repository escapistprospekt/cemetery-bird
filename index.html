<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cemetery Bird</title>
  <!-- Firebase (client SDK only — no server needed). The modular SDK is
       imported directly inside the <script type="module"> block below,
       matching the snippet Firebase's console gives you when you register
       a web app. See the CONFIG SETUP comment near the top of that script
       for setup steps — note the security RULES are configured in the
       Firebase Console itself (Firestore Database -> Rules tab), not here. -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      background: linear-gradient(#05030f 0%, #150e2e 35%, #2b1d4a 65%, #3a2c1a 70%, #241a10 100%);
      font-family: 'Segoe UI', Tahoma, sans-serif;
      touch-action: manipulation;
      user-select: none;
    }

    #wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      background: transparent;
      display: block;
      max-height: min(100vh, 700px);
      max-width: min(100vw, 467px);
      width: auto;
      height: auto;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.3);
      cursor: pointer;
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      color: #d8c9f0;
      text-shadow: 0 0 12px #7a4fd6aa, 2px 2px 0 #00000088;
      padding: 0 20px;
      text-align: center;
    }

    #overlay h1 {
      font-size: 2.2em;
      margin-bottom: 8px;
      font-family: 'Georgia', serif;
      letter-spacing: 1px;
    }

    #overlay p {
      font-size: 1em;
      opacity: 0.9;
    }

    #setupPanel {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }

    #nameInput {
      font-family: 'Georgia', serif;
      font-size: 1em;
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #7a6fa0;
      background: rgba(20, 14, 32, 0.65);
      color: #efe8c8;
      text-align: center;
      width: 200px;
      outline: none;
    }

    #nameInput::placeholder {
      color: #a698c4;
      opacity: 0.7;
    }

    #diffRow {
      display: flex;
      gap: 10px;
    }

    .diffBtn {
      pointer-events: auto;
      font-family: 'Georgia', serif;
      font-size: 0.85em;
      letter-spacing: 1px;
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #7a6fa0;
      background: rgba(40, 28, 60, 0.55);
      color: #d8c9f0;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
    }

    .diffBtn:hover {
      background: rgba(60, 42, 90, 0.75);
      transform: translateY(-1px);
    }

    .diffBtn.selected {
      background: #7a4fd6;
      border-color: #efe8c8;
      color: #efe8c8;
      box-shadow: 0 0 14px #7a4fd688;
    }

    #dashboardBtn {
      pointer-events: auto;
      font-family: 'Georgia', serif;
      font-size: 0.8em;
      letter-spacing: 1px;
      padding: 7px 14px;
      border-radius: 6px;
      border: 1px solid #5c8a7a;
      background: rgba(20, 40, 34, 0.5);
      color: #cfe8dc;
      cursor: pointer;
    }

    #dashboardBtn:hover {
      background: rgba(30, 60, 50, 0.7);
    }

    #score {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2.5em;
      font-weight: bold;
      color: #d8c9f0;
      text-shadow: 0 0 10px #7a4fd6aa, 3px 3px 0 #00000066;
      pointer-events: none;
      font-family: 'Georgia', serif;
    }

    #tagline {
      position: absolute;
      top: 74px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7em;
      font-style: italic;
      color: #a698c4;
      opacity: 0.75;
      pointer-events: none;
      font-family: 'Georgia', serif;
      white-space: nowrap;
    }

    #cityLabel {
      position: absolute;
      top: 96px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.85em;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #b8a8d8;
      opacity: 0.8;
      pointer-events: none;
      font-family: 'Georgia', serif;
    }

    #nameLabel {
      position: absolute;
      top: 24px;
      left: 20px;
      font-size: 0.8em;
      letter-spacing: 1px;
      color: #efe8c8;
      opacity: 0.9;
      pointer-events: none;
      font-family: 'Georgia', serif;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #triesLabel {
      position: absolute;
      top: 44px;
      left: 20px;
      font-size: 0.8em;
      letter-spacing: 1px;
      color: #d8c9f0;
      opacity: 0.85;
      pointer-events: none;
      font-family: 'Georgia', serif;
    }

    #diffLabel {
      position: absolute;
      top: 64px;
      left: 20px;
      font-size: 0.65em;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #a698c4;
      opacity: 0.7;
      pointer-events: none;
      font-family: 'Georgia', serif;
    }

    #cityBanner {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.6em;
      color: #efe8c8;
      text-shadow: 0 0 16px #000000cc, 0 0 30px #7a4fd6aa;
      font-family: 'Georgia', serif;
      letter-spacing: 2px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    #cityBanner.show {
      opacity: 1;
    }

    /* Full-screen freeze splash for finding Isaac */
    #isaacSplash {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(4, 2, 10, 0);
      backdrop-filter: blur(0px);
      -webkit-backdrop-filter: blur(0px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease, background 0.5s ease, backdrop-filter 0.5s ease;
      text-align: center;
      z-index: 10;
      cursor: pointer;
    }

    #isaacSplash.show {
      opacity: 1;
      background: rgba(4, 2, 10, 0.82);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      pointer-events: auto;
    }

    #isaacSplash .icon {
      font-size: 4.2em;
      filter: drop-shadow(0 0 18px #f0a83c88);
      transform: scale(0.85);
      transition: transform 0.5s cubic-bezier(.34, 1.56, .64, 1);
    }

    #isaacSplash.show .icon {
      transform: scale(1);
    }

    #isaacSplash h2 {
      margin-top: 14px;
      font-size: 1.9em;
      font-family: 'Georgia', serif;
      letter-spacing: 1px;
      color: #efe8c8;
      text-shadow: 0 0 20px #f0a83caa, 0 0 40px #7a4fd688;
    }

    #isaacSplash p {
      margin-top: 8px;
      font-size: 1em;
      font-style: italic;
      color: #b8a8d8;
      opacity: 0.85;
    }

    #isaacSplash .hint {
      margin-top: 26px;
      font-size: 0.8em;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #a698c4;
      opacity: 0.7;
      animation: pulseHint 1.6s ease-in-out infinite;
    }

    @keyframes pulseHint {

      0%,
      100% {
        opacity: 0.4;
      }

      50% {
        opacity: 0.9;
      }
    }

    /* Dashboard: leaderboard + full try history */
    #dashboardPanel {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(4, 2, 10, 0);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease, background 0.35s ease;
      z-index: 20;
      padding: 20px;
    }

    #dashboardPanel.show {
      opacity: 1;
      background: rgba(4, 2, 10, 0.88);
      pointer-events: auto;
    }

    #dashboardCard {
      background: rgba(24, 16, 40, 0.92);
      border: 1px solid #5c4a80;
      border-radius: 10px;
      width: 100%;
      max-width: 340px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      color: #d8c9f0;
      font-family: 'Georgia', serif;
      box-shadow: 0 0 30px rgba(122, 79, 214, 0.4);
    }

    #dashboardHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 10px;
      border-bottom: 1px solid #4a3a68;
    }

    #dashboardHeader h2 {
      font-size: 1.2em;
      letter-spacing: 1px;
      color: #efe8c8;
    }

    #dashboardCloseBtn {
      background: none;
      border: none;
      color: #d8c9f0;
      font-size: 1.3em;
      cursor: pointer;
      line-height: 1;
      padding: 4px 8px;
    }

    #dashboardBody {
      overflow-y: auto;
      padding: 12px 16px 18px;
    }

    #backendStatus {
      font-size: 0.7em;
      opacity: 0.6;
      font-style: italic;
      margin-bottom: 4px;
    }

    .dashSection h3 {
      font-size: 0.8em;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #a698c4;
      margin: 14px 0 8px;
    }

    .dashSection:first-child h3 {
      margin-top: 0;
    }

    .lbList {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .lbList li {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85em;
      padding: 5px 8px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.04);
    }

    .lbList li.empty {
      opacity: 0.6;
      font-style: italic;
      justify-content: center;
    }

    .lbRank {
      width: 24px;
      color: #f0a83c;
      font-weight: bold;
      flex-shrink: 0;
    }

    .lbName {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #efe8c8;
    }

    .lbScore {
      color: #d8c9f0;
      flex-shrink: 0;
    }

    .lbDiff {
      font-size: 0.85em;
      opacity: 0.65;
      text-transform: capitalize;
      flex-shrink: 0;
      width: 46px;
      text-align: right;
    }

    .lbDate {
      font-size: 0.75em;
      opacity: 0.55;
      flex-shrink: 0;
    }
  </style>
</head>

<body>
  <div id="wrap">
    <canvas id="game" width="400" height="600"></canvas>
    <div id="score">Isaac</div>
    <div id="tagline">Collect 50 Isaacs to increase your chances of finding Isaac</div>
    <div id="cityLabel">London</div>
    <div id="nameLabel"></div>
    <div id="triesLabel">Tries: 3</div>
    <div id="diffLabel">Normal</div>
    <div id="cityBanner"></div>
    <div id="overlay">
      <h1 id="msgTitle">Cemetery Bird</h1>
      <p id="msgSub">Enter your name, then tap or press Space to start</p>
      <div id="setupPanel">
        <input id="nameInput" type="text" maxlength="18" placeholder="Enter your name" autocomplete="off">
        <div id="diffRow">
          <button class="diffBtn" data-diff="easy">Easy</button>
          <button class="diffBtn selected" data-diff="normal">Normal</button>
          <button class="diffBtn" data-diff="hard">Hard</button>
        </div>
        <button id="dashboardBtn">📊 Dashboard</button>
      </div>
    </div>
    <div id="isaacSplash">
      <div class="icon">🪦</div>
      <h2>You found Isaac...</h2>
      <p>He rests among the fallen.</p>
      <div class="hint">Tap to continue flying</div>
    </div>
    <div id="dashboardPanel">
      <div id="dashboardCard">
        <div id="dashboardHeader">
          <h2>Dashboard</h2>
          <button id="dashboardCloseBtn">✕</button>
        </div>
        <div id="dashboardBody">
          <div id="backendStatus"></div>
          <div class="dashSection">
            <h3>Leaderboard</h3>
            <ul id="leaderboardList" class="lbList"></ul>
          </div>
          <div class="dashSection">
            <h3>All Tries</h3>
            <ul id="triesList" class="lbList"></ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import {
      getFirestore, collection, addDoc, getDocs, query, orderBy, limit
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    // =======================================================================
    // CONFIG SETUP — shared backend (Firebase Firestore)
    // =======================================================================
    // 1. Firestore must be turned on separately from Analytics — in the
    //    Firebase Console: Build -> Firestore Database -> Create database
    //    (any region, "test mode" is fine to start).
    // 2. The config below is exactly the object the console gives you when
    //    you register a web app (Project settings -> General -> Your apps).
    //    Make sure the FULL, unredacted apiKey and appId are pasted in —
    //    if you'd masked part of them before sharing, put the real values
    //    back here before pushing.
    // 3. RULES live in the console, not in this file: Firestore Database ->
    //    the "Rules" tab (next to "Data") -> replace the default rules with
    //    something like this -> click Publish. This is what allows public
    //    read + bounded, append-only writes so people can't post garbage
    //    or edit others' scores:
    //
    //      rules_version = '2';
    //      service cloud.firestore {
    //        match /databases/{database}/documents {
    //          match /runs/{doc} {
    //            allow read: if true;
    //            allow create: if request.resource.data.name is string
    //                          && request.resource.data.name.size() <= 20
    //                          && request.resource.data.score is number
    //                          && request.resource.data.score >= 0
    //                          && request.resource.data.score <= 1000
    //                          && request.resource.data.diff in ['easy','normal','hard']
    //                          && request.resource.data.date is number;
    //            allow update, delete: if false;
    //          }
    //        }
    //      }
    //
    // 4. Commit + push. If Firestore isn't set up yet, or init fails for
    //    any reason, the game still works fully — it falls back to a
    //    local-only leaderboard stored in this browser (see the
    //    backendStatus note in the Dashboard).
    const firebaseConfig = {
      apiKey: "AIzaSyCR5S50ae5G1Bzc6XLtHhLPj8ucVpFmvdI",
      authDomain: "cemetery-bird.firebaseapp.com",
      projectId: "cemetery-bird",
      storageBucket: "cemetery-bird.firebasestorage.app",
      messagingSenderId: "287341703938",
      appId: "1:287341703938:web:101d73fd8f338f522fc81b"
    };

    let db = null;
    let backendReady = false;
    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      backendReady = true;
    } catch (e) {
      console.warn('Firebase init failed, falling back to local-only leaderboard.', e);
      db = null;
      backendReady = false;
    }

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    const scoreEl = document.getElementById('score');
    const overlay = document.getElementById('overlay');
    const msgTitle = document.getElementById('msgTitle');
    const msgSub = document.getElementById('msgSub');
    const setupPanelEl = document.getElementById('setupPanel');
    const nameInputEl = document.getElementById('nameInput');
    const cityLabelEl = document.getElementById('cityLabel');
    const cityBannerEl = document.getElementById('cityBanner');
    const isaacSplashEl = document.getElementById('isaacSplash');
    const nameLabelEl = document.getElementById('nameLabel');
    const triesLabelEl = document.getElementById('triesLabel');
    const diffLabelEl = document.getElementById('diffLabel');
    const diffButtons = Array.from(document.querySelectorAll('.diffBtn'));
    const dashboardBtn = document.getElementById('dashboardBtn');
    const dashboardPanelEl = document.getElementById('dashboardPanel');
    const dashboardCardEl = document.getElementById('dashboardCard');
    const dashboardCloseBtn = document.getElementById('dashboardCloseBtn');
    const backendStatusEl = document.getElementById('backendStatus');
    const leaderboardListEl = document.getElementById('leaderboardList');
    const triesListEl = document.getElementById('triesList');

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    // ---------------------------------------------------------------------
    // Run history (dashboard + leaderboard)
    // ---------------------------------------------------------------------
    // Local cache always used for instant UI + as a fallback when the
    // shared backend isn't configured or a request fails. When Firebase
    // IS configured, the Leaderboard and All Tries lists are fetched from
    // Firestore instead, so every player sees the same shared data.
    const RUNS_KEY = 'cemeteryBirdRuns';
    function loadLocalRuns() {
      try {
        const raw = localStorage.getItem(RUNS_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }
    function saveLocalRuns(runs) {
      try {
        localStorage.setItem(RUNS_KEY, JSON.stringify(runs));
      } catch (e) {
        // storage unavailable (private browsing, sandboxed preview, etc.) — ignore
      }
    }
    let localRuns = loadLocalRuns();

    async function recordRun(name, score, diff) {
      const entry = { name, score, diff, date: Date.now() };
      localRuns.unshift(entry);
      if (localRuns.length > 200) localRuns.length = 200;
      saveLocalRuns(localRuns);
      if (db) {
        try {
          await addDoc(collection(db, 'runs'), entry);
        } catch (e) {
          console.warn('Could not save run to shared backend, kept locally only.', e);
        }
      }
    }

    async function fetchLeaderboard() {
      if (db) {
        try {
          const snap = await getDocs(query(collection(db, 'runs'), orderBy('score', 'desc'), limit(10)));
          return snap.docs.map(d => d.data());
        } catch (e) {
          console.warn('Could not load shared leaderboard, showing local scores instead.', e);
        }
      }
      return [...localRuns].sort((a, b) => b.score - a.score).slice(0, 10);
    }

    async function fetchRecentTries() {
      if (db) {
        try {
          const snap = await getDocs(query(collection(db, 'runs'), orderBy('date', 'desc'), limit(30)));
          return snap.docs.map(d => d.data());
        } catch (e) {
          console.warn('Could not load shared tries, showing local history instead.', e);
        }
      }
      return localRuns.slice(0, 30);
    }

    function renderList(el, rows, rowFn, emptyText) {
      el.innerHTML = rows.length ? rows.map(rowFn).join('') : `<li class="empty">${emptyText}</li>`;
    }

    async function renderDashboard() {
      backendStatusEl.textContent = backendReady
        ? 'Shared leaderboard (everyone who plays this site)'
        : 'Local only — shared backend not configured yet (see CONFIG SETUP in the file)';
      leaderboardListEl.innerHTML = '<li class="empty">Loading…</li>';
      triesListEl.innerHTML = '<li class="empty">Loading…</li>';
      const [leaderboard, tries] = await Promise.all([fetchLeaderboard(), fetchRecentTries()]);
      renderList(leaderboardListEl, leaderboard, (r, i) => `
        <li>
          <span class="lbRank">#${i + 1}</span>
          <span class="lbName">${escapeHtml(r.name)}</span>
          <span class="lbScore">${r.score} Isaac</span>
          <span class="lbDiff">${escapeHtml(r.diff)}</span>
        </li>`, 'No runs yet');
      renderList(triesListEl, tries, r => `
        <li>
          <span class="lbName">${escapeHtml(r.name)}</span>
          <span class="lbScore">${r.score} Isaac</span>
          <span class="lbDiff">${escapeHtml(r.diff)}</span>
          <span class="lbDate">${new Date(r.date).toLocaleDateString()}</span>
        </li>`, 'No tries yet');
    }
    dashboardBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      renderDashboard();
      dashboardPanelEl.classList.add('show');
    });
    dashboardCloseBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      dashboardPanelEl.classList.remove('show');
    });
    dashboardPanelEl.addEventListener('click', () => dashboardPanelEl.classList.remove('show'));
    dashboardCardEl.addEventListener('click', (e) => e.stopPropagation());
    nameInputEl.addEventListener('click', (e) => e.stopPropagation());
    nameInputEl.addEventListener('keydown', (e) => e.stopPropagation());

    // ---------------------------------------------------------------------
    // Player name
    // ---------------------------------------------------------------------
    let playerName = '';

    // ---------------------------------------------------------------------
    // Difficulty modes
    // ---------------------------------------------------------------------
    const DIFFICULTIES = {
      easy: { label: 'Easy', gravity: 0.35, flap: -7.5, pipeGap: 185, pipeSpeed: 2.2, pipeInterval: 105 },
      normal: { label: 'Normal', gravity: 0.45, flap: -8, pipeGap: 155, pipeSpeed: 2.6, pipeInterval: 95 },
      hard: { label: 'Hard', gravity: 0.55, flap: -8.5, pipeGap: 130, pipeSpeed: 3.2, pipeInterval: 85 }
    };
    let difficulty = 'normal';
    let cfg = DIFFICULTIES[difficulty];
    function selectDifficulty(key) {
      difficulty = key;
      cfg = DIFFICULTIES[key];
      diffLabelEl.textContent = cfg.label;
      diffButtons.forEach(btn => btn.classList.toggle('selected', btn.dataset.diff === key));
    }
    diffButtons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (state !== 'ready') return; // locked in once a run has started
        selectDifficulty(btn.dataset.diff);
      });
    });

    // ---------------------------------------------------------------------
    // Continues
    // ---------------------------------------------------------------------
    const MAX_CONTINUES = 3;
    let continuesLeft = MAX_CONTINUES;

    // Cities the bird passes through, one every 5 points, then looping
    const CITIES = [
      {
        id: 'london', name: 'London',
        skyTop: '#0c1420', skyMid: '#2a3a4a',
        groundColor: '#241d1a', grassColor: '#33423a', crackColor: '#161211',
        stone: '#5c6470', stoneOutline: '#2b3038', moss: 'rgba(80,110,90,0.30)',
        accent: '#1c2733', fog: 'rgba(200,210,220,0.14)'
      },
      {
        id: 'bologna', name: 'Bologna',
        skyTop: '#2a1410', skyMid: '#7a3d24',
        groundColor: '#3a2415', grassColor: '#5c3a22', crackColor: '#20130a',
        stone: '#a15c3e', stoneOutline: '#5c3220', moss: 'rgba(150,90,50,0.22)',
        accent: '#8a4a2e', fog: 'rgba(230,160,110,0.08)'
      },
      {
        id: 'napoli', name: 'Napoli',
        skyTop: '#050b1e', skyMid: '#1c2c50',
        groundColor: '#231f1c', grassColor: '#2e3b3a', crackColor: '#141210',
        stone: '#4a4f5c', stoneOutline: '#25272e', moss: 'rgba(70,100,90,0.30)',
        accent: '#c0392b', fog: 'rgba(180,190,220,0.10)'
      },
      {
        id: 'prague', name: 'Prague',
        skyTop: '#05030f', skyMid: '#2b1d4a',
        groundColor: '#241a10', grassColor: '#2f4028', crackColor: '#160f09',
        stone: '#5c5c66', stoneOutline: '#2e2e35', moss: 'rgba(90,120,70,0.35)',
        accent: '#4a2f5c', fog: 'rgba(210,200,230,0.10)'
      },
      {
        id: 'santorini', name: 'Santorini',
        skyTop: '#0a1830', skyMid: '#2a4a68',
        groundColor: '#2a2420', grassColor: '#3a5a6a', crackColor: '#161310',
        stone: '#e8e4d8', stoneOutline: '#8a8578', moss: 'rgba(70,130,180,0.25)',
        accent: '#2f6fa8', fog: 'rgba(200,220,230,0.10)'
      }
    ];
    const SCORES_PER_CITY = 5;
    function cityIndexForScore(s) {
      return Math.floor(s / SCORES_PER_CITY) % CITIES.length;
    }
    function formatScore(s) {
      return s === 0 ? 'Find Isaac' : `${s} Isaac`;
    }
    function formatBest(s) {
      return `${s} Isaac`;
    }
    let currentCity = CITIES[0];
    let lastCityIndex = 0;
    let bannerTimeout = null;
    function showBanner(text) {
      cityBannerEl.textContent = text;
      cityBannerEl.classList.add('show');
      clearTimeout(bannerTimeout);
      bannerTimeout = setTimeout(() => cityBannerEl.classList.remove('show'), 1800);
    }
    function showCityBanner(name) {
      showBanner(`Welcome to ${name}`);
    }

    // Special "Isaac's grave" set piece: freezes the game with a full-screen
    // splash, then a decorated grave with a candle spawns as the next obstacle.
    // With 5 cities cycling every 5 points, score 45-49 falls in Santorini,
    // and the reveal fires right as the 50th point is scored.
    const ISAAC_GRAVE_SCORE = 50;
    let isaacGraveTriggered = false;
    let pendingIsaacGrave = false;
    let frozen = false;

    function triggerIsaacFreeze() {
      frozen = true;
      isaacSplashEl.classList.add('show');
    }
    function resumeFromFreeze() {
      frozen = false;
      isaacSplashEl.classList.remove('show');
      // give the bird a lift so play picks back up smoothly
      bird.vy = cfg.flap;
    }

    // Show the overlay with a given headline/subline, optionally the
    // name/difficulty/dashboard setup row (only offered before a run starts).
    function showOverlay(title, sub, showSetup) {
      msgTitle.textContent = title;
      msgSub.textContent = sub;
      setupPanelEl.style.display = showSetup ? 'flex' : 'none';
      overlay.style.display = 'flex';
    }

    // Game state: ready | playing | continue | dead
    let state = 'ready';
    let frame = 0;
    let score = 0;
    let best = 0;

    const bird = {
      x: 90,
      y: H / 2,
      vy: 0,
      r: 14,
      rotation: 0
    };

    const PIPE_W = 62;

    let pipes = [];
    let groundOffset = 0;

    function resetGame() {
      bird.y = H / 2;
      bird.vy = 0;
      bird.rotation = 0;
      pipes = [];
      score = 0;
      frame = 0;
      scoreEl.textContent = formatScore(0);
      currentCity = CITIES[0];
      lastCityIndex = 0;
      cityLabelEl.textContent = currentCity.name;
      cityBannerEl.classList.remove('show');
      isaacGraveTriggered = false;
      pendingIsaacGrave = false;
      frozen = false;
      isaacSplashEl.classList.remove('show');
      continuesLeft = MAX_CONTINUES;
      triesLabelEl.textContent = `Tries: ${continuesLeft}`;
    }

    function beginRun() {
      const typed = nameInputEl.value.trim();
      playerName = (typed || 'Anonymous').slice(0, 18);
      nameLabelEl.textContent = playerName;
      state = 'playing';
      overlay.style.display = 'none';
      bird.vy = cfg.flap;
    }

    function flap() {
      if (frozen) {
        resumeFromFreeze();
        return;
      }
      if (state === 'ready') {
        beginRun();
      } else if (state === 'playing') {
        bird.vy = cfg.flap;
      } else if (state === 'continue') {
        state = 'playing';
        overlay.style.display = 'none';
        bird.vy = cfg.flap;
      } else if (state === 'dead') {
        resetGame();
        state = 'ready';
        showOverlay('Cemetery Bird', 'Ready for another try?', true);
      }
    }

    function spawnPipe() {
      const margin = 60;
      const gapY = margin + Math.random() * (H - margin * 2 - cfg.pipeGap - 100);
      const isaacGrave = pendingIsaacGrave;
      if (isaacGrave) pendingIsaacGrave = false;
      pipes.push({ x: W + 20, gapY, passed: false, isaacGrave });
    }

    function rectCircleColl(cx, cy, cr, rx, ry, rw, rh) {
      const closestX = Math.max(rx, Math.min(cx, rx + rw));
      const closestY = Math.max(ry, Math.min(cy, ry + rh));
      const dx = cx - closestX;
      const dy = cy - closestY;
      return (dx * dx + dy * dy) < (cr * cr);
    }

    function update() {
      if (frozen) {
        frame++; // keep ambient animation (stars, candle) alive while paused
        return;
      }
      frame++;

      if (state === 'playing') {
        bird.vy += cfg.gravity;
        bird.y += bird.vy;
        bird.rotation = Math.max(-0.5, Math.min(1.2, bird.vy / 10));

        if (frame % cfg.pipeInterval === 0) spawnPipe();

        for (const p of pipes) {
          p.x -= cfg.pipeSpeed;
          if (!p.passed && p.x + PIPE_W < bird.x) {
            p.passed = true;
            score++;
            scoreEl.textContent = formatScore(score);
            const foundIsaacNow = !isaacGraveTriggered && score === ISAAC_GRAVE_SCORE;
            const newCityIndex = cityIndexForScore(score);
            if (newCityIndex !== lastCityIndex && !foundIsaacNow) {
              lastCityIndex = newCityIndex;
              currentCity = CITIES[newCityIndex];
              cityLabelEl.textContent = currentCity.name;
              showCityBanner(currentCity.name);
            }
            if (foundIsaacNow) {
              isaacGraveTriggered = true;
              pendingIsaacGrave = true;
              triggerIsaacFreeze();
            }
          }
        }
        pipes = pipes.filter(p => p.x > -PIPE_W - 10);

        // collisions
        let hit = false;
        if (bird.y + bird.r > H - 40 || bird.y - bird.r < 0) hit = true;
        for (const p of pipes) {
          const topH = p.gapY;
          const botY = p.gapY + cfg.pipeGap;
          if (rectCircleColl(bird.x, bird.y, bird.r - 2, p.x, 0, PIPE_W, topH)) hit = true;
          if (rectCircleColl(bird.x, bird.y, bird.r - 2, p.x, botY, PIPE_W, H - botY)) hit = true;
        }

        if (hit) {
          if (continuesLeft > 0) {
            continuesLeft--;
            triesLabelEl.textContent = `Tries: ${continuesLeft}`;
            state = 'continue';
            // clear obstacles near the bird so resuming isn't an instant re-death
            pipes = pipes.filter(p => p.x > bird.x + 90 || p.x < bird.x - PIPE_W - 40);
            bird.y = H / 2;
            bird.vy = 0;
            bird.rotation = 0;
            const triesWord = continuesLeft === 1 ? 'try' : 'tries';
            showOverlay('You Fell...', `Score: ${formatScore(score)}  —  Tap to continue (${continuesLeft} ${triesWord} left)`, false);
          } else {
            state = 'dead';
            best = Math.max(best, score);
            recordRun(playerName, score, difficulty);
            showOverlay(
              'Rest in Peace',
              `Score: ${formatScore(score)}  •  Best: ${formatBest(best)}  —  Tap to rise again`,
              true
            );
          }
        }

        groundOffset -= cfg.pipeSpeed;
      } else if (state === 'ready') {
        bird.y = H / 2 + Math.sin(frame / 15) * 8;
      } else if (state === 'continue') {
        bird.y = H / 2 + Math.sin(frame / 15) * 6;
      } else if (state === 'dead') {
        if (bird.y + bird.r < H - 40) {
          bird.vy += cfg.gravity;
          bird.y += bird.vy;
        }
      }
    }

    function drawBird() {
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(bird.rotation);
      // subtle glow
      ctx.shadowColor = 'rgba(150, 90, 220, 0.5)';
      ctx.shadowBlur = 10;
      // body - crow black with a slight purple sheen
      ctx.fillStyle = '#1c1a24';
      ctx.beginPath();
      ctx.ellipse(0, 0, bird.r, bird.r * 0.85, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      // wing
      ctx.fillStyle = '#302b3d';
      const wingFlap = Math.sin(frame / 5) * 4;
      ctx.beginPath();
      ctx.ellipse(-3, 2 + wingFlap, 7, 5, 0.3, 0, Math.PI * 2);
      ctx.fill();
      // eye
      ctx.fillStyle = '#c0392b';
      ctx.beginPath();
      ctx.arc(6, -4, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(7, -4, 1.6, 0, Math.PI * 2);
      ctx.fill();
      // beak
      ctx.fillStyle = '#3a3a3a';
      ctx.beginPath();
      ctx.moveTo(bird.r - 2, -2);
      ctx.lineTo(bird.r + 9, 1);
      ctx.lineTo(bird.r - 2, 5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawTombstone(x, y, w, h, archAtTop) {
      ctx.fillStyle = currentCity.stone;
      ctx.strokeStyle = currentCity.stoneOutline;
      ctx.lineWidth = 3;
      ctx.beginPath();
      if (archAtTop) {
        // rounded top, flat bottom (grows down from above)
        ctx.moveTo(x, y + h);
        ctx.lineTo(x, y + w / 2);
        ctx.arc(x + w / 2, y + w / 2, w / 2, Math.PI, 0, false);
        ctx.lineTo(x + w, y + h);
        ctx.closePath();
      } else {
        // flat top, rounded bottom feel skipped (rises from ground) - keep flat top, slight taper
        ctx.moveTo(x, y);
        ctx.lineTo(x + w, y);
        ctx.lineTo(x + w, y + h);
        ctx.lineTo(x, y + h);
        ctx.closePath();
      }
      ctx.fill();
      ctx.stroke();

      // moss patches
      ctx.fillStyle = currentCity.moss;
      ctx.beginPath();
      ctx.ellipse(x + w * 0.3, y + h * 0.7, w * 0.22, h * 0.06, 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x + w * 0.65, y + h * 0.4, w * 0.18, h * 0.05, -0.2, 0, Math.PI * 2);
      ctx.fill();

      // carved cross
      const cx = x + w / 2;
      const cy = archAtTop ? y + h - 30 : y + 26;
      ctx.strokeStyle = 'rgba(20,20,25,0.75)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(cx, cy - 10);
      ctx.lineTo(cx, cy + 10);
      ctx.moveTo(cx - 7, cy - 3);
      ctx.lineTo(cx + 7, cy - 3);
      ctx.stroke();
    }

    function drawIsaacGrave(x, y, w, h) {
      // ground mound
      ctx.fillStyle = currentCity.groundColor;
      ctx.beginPath();
      ctx.ellipse(x + w / 2, y + h - 4, w * 0.85, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      // headstone, slightly warmer/lighter than regular tombstones
      ctx.fillStyle = '#c9c0a8';
      ctx.strokeStyle = '#6b6250';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x, y + h);
      ctx.lineTo(x, y + w / 2);
      ctx.arc(x + w / 2, y + w / 2, w / 2, Math.PI, 0, false);
      ctx.lineTo(x + w, y + h);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // carved name
      ctx.fillStyle = '#3a352c';
      ctx.font = 'bold 13px Georgia';
      ctx.textAlign = 'center';
      ctx.fillText('ISAAC', x + w / 2, y + h - 34);
      ctx.font = '9px Georgia';
      ctx.fillText('here he rests', x + w / 2, y + h - 20);
      ctx.textAlign = 'left';

      // a small flickering candle beside it
      const flicker = 0.6 + 0.4 * Math.sin(frame / 6);
      ctx.fillStyle = '#e8dcc0';
      ctx.fillRect(x + w + 6, y + h - 16, 4, 16);
      ctx.save();
      ctx.globalAlpha = flicker;
      ctx.fillStyle = '#f0a83c';
      ctx.beginPath();
      ctx.ellipse(x + w + 8, y + h - 20, 3, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawPipes() {
      for (const p of pipes) {
        const topH = p.gapY;
        const botY = p.gapY + cfg.pipeGap;
        // hanging stalactite-style stone from above (cut off at top of screen)
        drawTombstone(p.x, 0, PIPE_W, topH, false);
        // rising tombstone from the ground, rounded top facing the gap
        if (p.isaacGrave) {
          drawIsaacGrave(p.x, botY, PIPE_W, H - botY - 40);
        } else {
          drawTombstone(p.x, botY, PIPE_W, H - botY - 40, true);
        }
      }
    }

    function drawGround() {
      ctx.fillStyle = currentCity.groundColor;
      ctx.fillRect(0, H - 40, W, 40);
      // top edge accent
      ctx.fillStyle = currentCity.grassColor;
      ctx.fillRect(0, H - 40, W, 6);
      // scattered pebbles/cracks
      ctx.fillStyle = currentCity.crackColor;
      const stripeW = 24;
      let off = groundOffset % stripeW;
      for (let x = off - stripeW; x < W; x += stripeW) {
        ctx.fillRect(x, H - 30, 10, 3);
      }
    }

    const stars = Array.from({ length: 40 }, () => ({
      x: Math.random() * W,
      y: Math.random() * (H * 0.55),
      r: Math.random() * 1.4 + 0.4,
      phase: Math.random() * Math.PI * 2
    }));

    function drawSky() {
      // gradient backdrop, tinted per city
      const grad = ctx.createLinearGradient(0, 0, 0, H - 40);
      grad.addColorStop(0, currentCity.skyTop);
      grad.addColorStop(1, currentCity.skyMid);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H - 40);

      // moon
      ctx.save();
      ctx.shadowColor = 'rgba(230, 225, 200, 0.6)';
      ctx.shadowBlur = 25;
      ctx.fillStyle = '#efe8c8';
      ctx.beginPath();
      ctx.arc(W - 70, 80, 32, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      // moon craters
      ctx.fillStyle = 'rgba(200, 195, 165, 0.5)';
      ctx.beginPath();
      ctx.arc(W - 80, 70, 5, 0, Math.PI * 2);
      ctx.arc(W - 62, 90, 4, 0, Math.PI * 2);
      ctx.arc(W - 58, 68, 3, 0, Math.PI * 2);
      ctx.fill();

      // stars
      for (const s of stars) {
        const twinkle = 0.5 + 0.5 * Math.sin(frame / 30 + s.phase);
        ctx.fillStyle = `rgba(255,255,255,${0.3 + twinkle * 0.6})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      drawSkyline();
    }

    function drawSkyline() {
      const baseY = H - 40;
      const parallax = (frame * 0.6) % 140;
      ctx.fillStyle = currentCity.accent;
      ctx.globalAlpha = 0.55;

      for (let i = -1; i < 4; i++) {
        const x = i * 140 - parallax;
        switch (currentCity.id) {
          case 'london': {
            // clocktower: tall narrow spire with a clock circle
            ctx.fillRect(x + 55, baseY - 120, 20, 120);
            ctx.beginPath();
            ctx.moveTo(x + 50, baseY - 120);
            ctx.lineTo(x + 65, baseY - 145);
            ctx.lineTo(x + 80, baseY - 120);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = currentCity.skyTop;
            ctx.beginPath();
            ctx.arc(x + 65, baseY - 90, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = currentCity.accent;
            break;
          }
          case 'bologna': {
            // low arched portico
            for (let a = 0; a < 3; a++) {
              const ax = x + a * 24;
              ctx.beginPath();
              ctx.moveTo(ax, baseY);
              ctx.lineTo(ax, baseY - 40);
              ctx.arc(ax + 10, baseY - 40, 10, Math.PI, 0, false);
              ctx.lineTo(ax + 20, baseY);
              ctx.closePath();
              ctx.fill();
            }
            break;
          }
          case 'napoli': {
            // volcano with a glowing peak
            ctx.beginPath();
            ctx.moveTo(x + 20, baseY);
            ctx.lineTo(x + 70, baseY - 100);
            ctx.lineTo(x + 120, baseY);
            ctx.closePath();
            ctx.fill();
            ctx.globalAlpha = 0.8;
            ctx.fillStyle = '#e0592f';
            ctx.beginPath();
            ctx.arc(x + 70, baseY - 100, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = currentCity.accent;
            break;
          }
          case 'prague': {
            // thin gothic spires
            for (let a = 0; a < 2; a++) {
              const ax = x + a * 40;
              ctx.beginPath();
              ctx.moveTo(ax, baseY);
              ctx.lineTo(ax + 6, baseY - 110 - a * 20);
              ctx.lineTo(ax + 12, baseY);
              ctx.closePath();
              ctx.fill();
            }
            break;
          }
          case 'santorini': {
            // cluster of whitewashed cliffside buildings with blue domes
            for (let a = 0; a < 2; a++) {
              const ax = x + a * 55;
              ctx.fillStyle = '#e8e4d8';
              ctx.fillRect(ax, baseY - 34, 30, 34);
              ctx.fillStyle = currentCity.accent;
              ctx.beginPath();
              ctx.arc(ax + 15, baseY - 34, 13, Math.PI, 0, false);
              ctx.fill();
            }
            ctx.fillStyle = currentCity.accent;
            break;
          }
        }
      }
      ctx.globalAlpha = 1;
    }

    function drawFog() {
      ctx.fillStyle = currentCity.fog;
      for (let i = 0; i < 3; i++) {
        const cx = ((frame * 0.3 + i * 180) % (W + 100)) - 50;
        const cy = H - 90 - i * 30;
        ctx.beginPath();
        ctx.ellipse(cx, cy, 60, 16, 0, 0, Math.PI * 2);
        ctx.ellipse(cx + 40, cy + 4, 45, 13, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      drawSky();
      drawPipes();
      drawFog();
      drawGround();
      drawBird();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    canvas.addEventListener('mousedown', flap);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); flap(); }, { passive: false });
    isaacSplashEl.addEventListener('mousedown', flap);
    isaacSplashEl.addEventListener('touchstart', (e) => { e.preventDefault(); flap(); }, { passive: false });
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        if (document.activeElement === nameInputEl) return; // don't hijack spacebar while typing
        e.preventDefault();
        flap();
      }
    });

    resetGame();
    diffLabelEl.textContent = cfg.label;
    loop();
  </script>
</body>

</html>
