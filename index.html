<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cemetery Bird</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: linear-gradient(#05030f 0%, #150e2e 35%, #2b1d4a 65%, #3a2c1a 70%, #241a10 100%);
    font-family: 'Segoe UI', Tahoma, sans-serif;
    touch-action: manipulation;
    user-select: none;
  }
  #wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    background: transparent;
    display: block;
    max-height: 100vh;
    max-width: 100vw;
    box-shadow: 0 0 40px rgba(0,0,0,0.3);
    cursor: pointer;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    color: #d8c9f0;
    text-shadow: 0 0 12px #7a4fd6aa, 2px 2px 0 #00000088;
  }
  #overlay h1 {
    font-size: 2.2em;
    margin-bottom: 8px;
    font-family: 'Georgia', serif;
    letter-spacing: 1px;
  }
  #overlay p {
    font-size: 1em;
    opacity: 0.9;
  }
  #score {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 2.5em;
    font-weight: bold;
    color: #d8c9f0;
    text-shadow: 0 0 10px #7a4fd6aa, 3px 3px 0 #00000066;
    pointer-events: none;
    font-family: 'Georgia', serif;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="400" height="600"></canvas>
  <div id="score">0</div>
  <div id="overlay">
    <h1 id="msgTitle">Cemetery Bird</h1>
    <p id="msgSub">Tap or press Space to rise</p>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const scoreEl = document.getElementById('score');
const overlay = document.getElementById('overlay');
const msgTitle = document.getElementById('msgTitle');
const msgSub = document.getElementById('msgSub');

// Game state
let state = 'ready'; // ready | playing | dead
let frame = 0;
let score = 0;
let best = 0;

const bird = {
  x: 90,
  y: H / 2,
  vy: 0,
  r: 14,
  rotation: 0
};

const GRAVITY = 0.45;
const FLAP = -8;
const PIPE_GAP = 155;
const PIPE_W = 62;
const PIPE_SPEED = 2.6;
const PIPE_INTERVAL = 95;

let pipes = [];
let groundOffset = 0;

function resetGame() {
  bird.y = H / 2;
  bird.vy = 0;
  bird.rotation = 0;
  pipes = [];
  score = 0;
  frame = 0;
  scoreEl.textContent = '0';
}

function flap() {
  if (state === 'ready') {
    state = 'playing';
    overlay.style.display = 'none';
    bird.vy = FLAP;
  } else if (state === 'playing') {
    bird.vy = FLAP;
  } else if (state === 'dead') {
    resetGame();
    state = 'ready';
    overlay.style.display = 'flex';
    msgTitle.textContent = 'Cemetery Bird';
    msgSub.textContent = 'Tap or press Space to rise';
  }
}

function spawnPipe() {
  const margin = 60;
  const gapY = margin + Math.random() * (H - margin * 2 - PIPE_GAP - 100);
  pipes.push({ x: W + 20, gapY, passed: false });
}

function rectCircleColl(cx, cy, cr, rx, ry, rw, rh) {
  const closestX = Math.max(rx, Math.min(cx, rx + rw));
  const closestY = Math.max(ry, Math.min(cy, ry + rh));
  const dx = cx - closestX;
  const dy = cy - closestY;
  return (dx * dx + dy * dy) < (cr * cr);
}

function update() {
  frame++;

  if (state === 'playing') {
    bird.vy += GRAVITY;
    bird.y += bird.vy;
    bird.rotation = Math.max(-0.5, Math.min(1.2, bird.vy / 10));

    if (frame % PIPE_INTERVAL === 0) spawnPipe();

    for (const p of pipes) {
      p.x -= PIPE_SPEED;
      if (!p.passed && p.x + PIPE_W < bird.x) {
        p.passed = true;
        score++;
        scoreEl.textContent = score;
      }
    }
    pipes = pipes.filter(p => p.x > -PIPE_W - 10);

    // collisions
    let hit = false;
    if (bird.y + bird.r > H - 40 || bird.y - bird.r < 0) hit = true;
    for (const p of pipes) {
      const topH = p.gapY;
      const botY = p.gapY + PIPE_GAP;
      if (rectCircleColl(bird.x, bird.y, bird.r - 2, p.x, 0, PIPE_W, topH)) hit = true;
      if (rectCircleColl(bird.x, bird.y, bird.r - 2, p.x, botY, PIPE_W, H - botY)) hit = true;
    }

    if (hit) {
      state = 'dead';
      best = Math.max(best, score);
      overlay.style.display = 'flex';
      msgTitle.textContent = 'Rest in Peace';
      msgSub.textContent = `Score: ${score}  •  Best: ${best}  —  Tap to rise again`;
    }

    groundOffset -= PIPE_SPEED;
  } else if (state === 'ready') {
    bird.y = H / 2 + Math.sin(frame / 15) * 8;
  } else if (state === 'dead') {
    if (bird.y + bird.r < H - 40) {
      bird.vy += GRAVITY;
      bird.y += bird.vy;
    }
  }
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rotation);
  // subtle glow
  ctx.shadowColor = 'rgba(150, 90, 220, 0.5)';
  ctx.shadowBlur = 10;
  // body - crow black with a slight purple sheen
  ctx.fillStyle = '#1c1a24';
  ctx.beginPath();
  ctx.ellipse(0, 0, bird.r, bird.r * 0.85, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  // wing
  ctx.fillStyle = '#302b3d';
  const wingFlap = Math.sin(frame / 5) * 4;
  ctx.beginPath();
  ctx.ellipse(-3, 2 + wingFlap, 7, 5, 0.3, 0, Math.PI * 2);
  ctx.fill();
  // eye
  ctx.fillStyle = '#c0392b';
  ctx.beginPath();
  ctx.arc(6, -4, 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(7, -4, 1.6, 0, Math.PI * 2);
  ctx.fill();
  // beak
  ctx.fillStyle = '#3a3a3a';
  ctx.beginPath();
  ctx.moveTo(bird.r - 2, -2);
  ctx.lineTo(bird.r + 9, 1);
  ctx.lineTo(bird.r - 2, 5);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawTombstone(x, y, w, h, archAtTop) {
  ctx.fillStyle = '#5c5c66';
  ctx.strokeStyle = '#2e2e35';
  ctx.lineWidth = 3;
  ctx.beginPath();
  if (archAtTop) {
    // rounded top, flat bottom (grows down from above)
    ctx.moveTo(x, y + h);
    ctx.lineTo(x, y + w / 2);
    ctx.arc(x + w / 2, y + w / 2, w / 2, Math.PI, 0, false);
    ctx.lineTo(x + w, y + h);
    ctx.closePath();
  } else {
    // flat top, rounded bottom feel skipped (rises from ground) - keep flat top, slight taper
    ctx.moveTo(x, y);
    ctx.lineTo(x + w, y);
    ctx.lineTo(x + w, y + h);
    ctx.lineTo(x, y + h);
    ctx.closePath();
  }
  ctx.fill();
  ctx.stroke();

  // moss patches
  ctx.fillStyle = 'rgba(90, 120, 70, 0.35)';
  ctx.beginPath();
  ctx.ellipse(x + w * 0.3, y + h * 0.7, w * 0.22, h * 0.06, 0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x + w * 0.65, y + h * 0.4, w * 0.18, h * 0.05, -0.2, 0, Math.PI * 2);
  ctx.fill();

  // carved cross
  const cx = x + w / 2;
  const cy = archAtTop ? y + h - 30 : y + 26;
  ctx.strokeStyle = 'rgba(30,30,35,0.8)';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(cx, cy - 10);
  ctx.lineTo(cx, cy + 10);
  ctx.moveTo(cx - 7, cy - 3);
  ctx.lineTo(cx + 7, cy - 3);
  ctx.stroke();
}

function drawPipes() {
  for (const p of pipes) {
    const topH = p.gapY;
    const botY = p.gapY + PIPE_GAP;
    // hanging stalactite-style stone from above (cut off at top of screen)
    drawTombstone(p.x, 0, PIPE_W, topH, false);
    // rising tombstone from the ground, rounded top facing the gap
    drawTombstone(p.x, botY, PIPE_W, H - botY - 40, true);
  }
}

function drawGround() {
  ctx.fillStyle = '#241a10';
  ctx.fillRect(0, H - 40, W, 40);
  // grass edge
  ctx.fillStyle = '#2f4028';
  ctx.fillRect(0, H - 40, W, 6);
  // scattered pebbles/cracks
  ctx.fillStyle = '#1a120b';
  const stripeW = 24;
  let off = groundOffset % stripeW;
  for (let x = off - stripeW; x < W; x += stripeW) {
    ctx.fillRect(x, H - 30, 10, 3);
  }
}

const stars = Array.from({ length: 40 }, () => ({
  x: Math.random() * W,
  y: Math.random() * (H * 0.55),
  r: Math.random() * 1.4 + 0.4,
  phase: Math.random() * Math.PI * 2
}));

function drawSky() {
  // moon
  ctx.save();
  ctx.shadowColor = 'rgba(230, 225, 200, 0.6)';
  ctx.shadowBlur = 25;
  ctx.fillStyle = '#efe8c8';
  ctx.beginPath();
  ctx.arc(W - 70, 80, 32, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  // moon craters
  ctx.fillStyle = 'rgba(200, 195, 165, 0.5)';
  ctx.beginPath();
  ctx.arc(W - 80, 70, 5, 0, Math.PI * 2);
  ctx.arc(W - 62, 90, 4, 0, Math.PI * 2);
  ctx.arc(W - 58, 68, 3, 0, Math.PI * 2);
  ctx.fill();

  // stars
  for (const s of stars) {
    const twinkle = 0.5 + 0.5 * Math.sin(frame / 30 + s.phase);
    ctx.fillStyle = `rgba(255,255,255,${0.3 + twinkle * 0.6})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawFog() {
  ctx.fillStyle = 'rgba(210, 200, 230, 0.10)';
  for (let i = 0; i < 3; i++) {
    const cx = ((frame * 0.3 + i * 180) % (W + 100)) - 50;
    const cy = H - 90 - i * 30;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 60, 16, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + 40, cy + 4, 45, 13, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawSky();
  drawPipes();
  drawFog();
  drawGround();
  drawBird();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

canvas.addEventListener('mousedown', flap);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); flap(); }, { passive: false });
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); flap(); }
});

resetGame();
loop();
</script>
</body>
</html>
